<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reverse Feud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep: #170B2E;
    --bg-panel: #241344;
    --bg-panel-2: #2E1857;
    --gold: #F5B700;
    --gold-dim: #C89400;
    --green: #35C97B;
    --red: #FF5470;
    --text-light: #F5EFFF;
    --text-dim: #B8A9D9;
    --tile-grad: linear-gradient(155deg, #3A1E6B 0%, #241344 100%);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(ellipse at top, #2A1650 0%, var(--bg-deep) 55%, #0D0620 100%);
    color: var(--text-light);
    font-family: 'Manrope', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .display{ font-family:'Anton', sans-serif; letter-spacing: 0.5px; text-transform: uppercase; }
  #app{ position:relative; z-index:1; max-width: 1100px; margin: 0 auto; padding: 20px 20px 60px; }

  /* ---------- ANIMATED BACKGROUND ---------- */
  body::before, body::after{
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background-repeat:repeat;
  }
  /* Layer 1: gold shapes drifting down-right */
  body::before{
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120' viewBox='0 0 120 120'><g fill='none' stroke='%23F5B700' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='20' cy='22' r='8'/><path d='M80 14v16M72 22h16'/><path d='M30 82l10-10 10 10-10 10z'/><path d='M92 88l8 14h-16z'/></g></svg>");
    background-size:120px 120px;
    opacity:0.08;
    animation: bgDriftA 40s linear infinite;
  }
  /* Layer 2: larger faint shapes drifting the opposite way for depth */
  body::after{
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220' viewBox='0 0 220 220'><g fill='none' stroke='%23C77DFF' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><circle cx='50' cy='60' r='18'/><path d='M150 40l16 28h-32z'/><path d='M60 160l20-20 20 20-20 20z'/><path d='M160 150v28M146 164h28'/></g></svg>");
    background-size:220px 220px;
    opacity:0.07;
    animation: bgDriftB 70s linear infinite;
  }
  @keyframes bgDriftA{ from{background-position:0 0;} to{background-position:120px 120px;} }
  @keyframes bgDriftB{ from{background-position:0 0;} to{background-position:-220px 220px;} }
  @media (prefers-reduced-motion: reduce){
    body::before, body::after{ animation:none; }
  }


  /* ---------- SETUP SCREEN ---------- */
  .setup-wrap{
    min-height: 90vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:28px;
  }
  .setup-title{
    font-size: clamp(42px, 8vw, 76px);
    line-height: 0.95;
    background: linear-gradient(180deg, #FFE9A8 0%, var(--gold) 55%, var(--gold-dim) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 4px 0 rgba(0,0,0,0.25);
  }
  .setup-sub{ color: var(--text-dim); font-size:16px; max-width: 520px; }
  .setup-sub b{ color: var(--gold); }
  .card{
    background: var(--bg-panel);
    border: 1px solid rgba(245,183,0,0.18);
    border-radius: 18px;
    padding: 28px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    max-width: 460px;
  }
  .step-label{ font-size:13px; letter-spacing:2px; color: var(--gold); text-transform:uppercase; font-weight:800; margin-bottom:14px;}
  .step-block + .step-block{ margin-top: 26px; padding-top: 22px; border-top: 1px solid rgba(255,255,255,0.08); }
  .count-row{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .count-btn{
    width: 48px; height:48px; border-radius: 50%;
    border: 2px solid rgba(245,183,0,0.35);
    background: var(--bg-panel-2); color: var(--text-light);
    font-family:'Anton',sans-serif; font-size:19px; cursor:pointer;
    transition: all .15s ease;
  }
  .count-btn:hover{ border-color: var(--gold); transform: translateY(-2px); }
  .count-btn.active{ background: var(--gold); color: #241344; border-color: var(--gold); box-shadow: 0 0 0 4px rgba(245,183,0,0.2);}
  .name-list{ display:flex; flex-direction:column; gap:12px; margin-top: 18px; width: 340px; max-width: 80vw; }
  .name-row{ display:flex; align-items:center; gap:10px; }
  .name-swatch{ width:14px; height:14px; border-radius:4px; flex:none; }
  .name-row input{
    flex:1; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(245,183,0,0.25);
    background: var(--bg-deep); color: var(--text-light); font-size:15px; font-family:'Manrope',sans-serif;
    outline:none;
  }
  .name-row input:focus{ border-color: var(--gold); }
  .btn{
    font-family:'Anton',sans-serif; letter-spacing:1px; text-transform:uppercase;
    border:none; border-radius: 12px; cursor:pointer; transition: all .15s ease;
  }
  .btn-primary{
    background: linear-gradient(180deg, #FFD75E, var(--gold));
    color: #241344; padding: 15px 34px; font-size: 18px;
    box-shadow: 0 8px 0 var(--gold-dim), 0 14px 24px rgba(0,0,0,0.35);
  }
  .btn-primary:hover{ transform: translateY(-2px); }
  .btn-primary:active{ transform: translateY(2px); box-shadow: 0 4px 0 var(--gold-dim); }
  .btn-primary:disabled{ opacity:0.4; cursor:not-allowed; transform:none; }
  .rounds-hint{ color: var(--text-dim); font-size: 12px; margin-top: 10px; }

  /* ---------- GAME HEADER ---------- */
  .scoreboard{
    display:flex; gap:10px; flex-wrap:wrap; justify-content:center;
    padding: 14px 10px; margin-bottom: 22px;
    background: var(--bg-panel); border-radius: 16px; border:1px solid rgba(245,183,0,0.15);
    position: sticky; top: 10px; z-index: 20; backdrop-filter: blur(6px);
  }
  .podium{
    min-width: 120px; padding: 10px 16px; border-radius: 12px; text-align:center;
    background: var(--bg-panel-2); border: 2px solid transparent; position:relative;
    transition: all .2s ease;
  }
  .podium.active{
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(245,183,0,0.18), 0 6px 18px rgba(245,183,0,0.25);
    transform: translateY(-3px);
  }
  .podium.active::after{
    content: "▲ TURN"; position:absolute; bottom:-20px; left:50%; transform:translateX(-50%);
    font-size:10px; letter-spacing:1px; color: var(--gold); font-family:'Anton',sans-serif;
  }
  .podium .pname{ font-size:13px; color: var(--text-dim); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:140px; margin:0 auto; }
  .podium .pscore{ font-family:'Anton',sans-serif; font-size:26px; color: var(--gold); }

  .title-row{ text-align:center; margin: 8px 0 26px; }
  .title-row h1{ font-size: clamp(30px,5vw,48px); margin:0; color: var(--gold); }
  .title-row p{ color: var(--text-dim); margin:6px 0 0; font-size:14px;}

  /* ---------- BOARD ---------- */
  .board{ display:grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; }
  .tile{
    background: var(--tile-grad);
    border-radius: 16px; padding: 22px 18px; min-height: 130px;
    cursor:pointer; border: 1px solid rgba(255,255,255,0.06);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    transition: transform .15s ease, box-shadow .15s ease;
    position: relative; overflow:hidden;
  }
  .tile::before{
    content:""; position:absolute; inset:0;
    background: radial-gradient(circle at 20% 0%, rgba(245,183,0,0.15), transparent 60%);
    opacity:0; transition: opacity .2s ease;
  }
  .tile:hover:not(.done)::before{ opacity:1; }
  .tile:hover:not(.done){ transform: translateY(-4px); box-shadow: 0 14px 30px rgba(0,0,0,0.4); }
  .tile-number{ font-family:'Anton',sans-serif; font-size: 52px; color: var(--gold); line-height:1; text-shadow: 0 4px 0 rgba(0,0,0,0.3); }
  .tile-cat{ font-size: 11px; letter-spacing:2px; color: var(--text-dim); text-transform:uppercase; font-weight:700;}
  .tile-solved{ color: var(--green); font-size:12px; font-weight:800; }
  .tile.done{ opacity:0.4; cursor:default; filter: grayscale(0.6); }
  .tile.done .tile-number{ color: var(--text-dim); }

  /* ---------- MODAL ---------- */
  .overlay{
    position: fixed; inset:0; background: rgba(8,4,20,0.82); backdrop-filter: blur(4px);
    display:flex; align-items:center; justify-content:center; z-index: 100; padding: 16px;
  }
  .modal{
    background: var(--bg-panel); border-radius: 20px; max-width: 640px; width:100%;
    max-height: 92vh; overflow-y:auto; padding: 26px 24px 22px;
    border: 1px solid rgba(245,183,0,0.2); box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  }
  .modal-q{ font-size: clamp(18px,3vw,22px); font-weight:800; margin: 0 0 6px; text-align:center; }
  .round-label{ text-align:center; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color: var(--gold-dim); font-weight:800; margin-bottom: 14px; }
  .slots{ display:flex; flex-direction:column; gap:8px; margin-bottom: 18px; }
  .slot{
    display:flex; align-items:center; justify-content:space-between;
    background: var(--bg-deep); border-radius: 10px; padding: 10px 14px;
    border: 1px solid rgba(255,255,255,0.06); min-height: 42px;
    transition: background .2s ease;
  }
  .slot .sidx{ font-family:'Anton',sans-serif; color: var(--text-dim); font-size:13px; width:22px; flex:none; }
  .slot .sanswer{ flex:1; text-align:left; font-weight:700; color: var(--text-dim); font-size:14px; }
  .slot .sreveal{
    flex:none; margin-right:10px; padding:5px 12px; border-radius:8px; cursor:pointer;
    background: transparent; color: var(--gold); border:1px solid rgba(245,183,0,0.5);
    font-family:'Manrope',sans-serif; font-weight:700; font-size:12px;
    transition: all .15s ease;
  }
  .slot .sreveal:hover{ background: rgba(245,183,0,0.15); border-color: var(--gold); }
  .slot.revealed{ background: linear-gradient(90deg, rgba(53,201,123,0.16), transparent); }
  .slot.revealed .sanswer{ color: var(--text-light); }
  .slot .spts{
    font-family:'Anton',sans-serif; font-size:14px; color: #241344;
    background: var(--gold); border-radius:6px; padding:2px 10px; min-width: 40px; text-align:center; flex:none;
  }
  .slot:not(.revealed) .spts{ background: rgba(255,255,255,0.08); color: var(--text-dim); }
  .slot:not(.revealed) .spts::after{ content:"?"; }
  .slot.revealed .spts::after{ content: attr(data-pts); }

  .guess-row{ display:flex; gap:10px; margin-top: 6px; }
  .guess-row input{
    flex:1; padding: 13px 14px; border-radius: 10px; border: 1px solid rgba(245,183,0,0.3);
    background: var(--bg-deep); color: var(--text-light); font-size:15px; outline:none;
  }
  .guess-row input:focus{ border-color: var(--gold); }
  .btn-guess{ background: var(--green); color:#0D2818; padding: 0 22px; font-size:15px; box-shadow: 0 6px 0 #1E8552; }
  .btn-guess:active{ transform: translateY(3px); box-shadow:none; }
  .feedback{ min-height: 22px; text-align:center; font-weight:800; font-size:14px; margin-top:10px; }
  .feedback.ok{ color: var(--green); }
  .feedback.bad{ color: var(--red); }
  .feedback.info{ color: var(--gold); }

  .modal-footer{ display:flex; justify-content:space-between; align-items:center; margin-top: 20px; gap:10px; flex-wrap:wrap;}
  .btn-secondary{
    background: transparent; border: 1px solid rgba(255,84,112,0.5); color: var(--red);
    padding: 10px 18px; font-size:13px;
  }
  .btn-secondary:hover{ background: rgba(255,84,112,0.1); }
  .btn-close{
    background: var(--bg-panel-2); color: var(--text-light); border:1px solid rgba(255,255,255,0.1);
    padding:10px 18px; font-size:13px;
  }
  .turn-note{ text-align:center; color: var(--text-dim); font-size:12px; margin-bottom: 10px; }
  .turn-note b{ color: var(--gold); }

  /* ---------- ROUND DIALOG ---------- */
  .round-dialog{
    background: var(--bg-panel); border-radius: 20px; max-width: 320px; width:100%;
    padding: 34px 26px; text-align:center;
    border: 1px solid rgba(245,183,0,0.35); box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  }
  .round-dialog .rd-eyebrow{ font-size:12px; letter-spacing:2px; color: var(--text-dim); text-transform:uppercase; font-weight:800; margin-bottom: 8px;}
  .round-dialog .rd-title{ font-size: 44px; color: var(--gold); margin: 0 0 20px; }
  .round-dialog .btn-primary{ width:100%; padding: 13px 0; font-size:15px; }

  @keyframes shake{ 10%,90%{transform:translateX(-2px);} 20%,80%{transform:translateX(4px);} 30%,50%,70%{transform:translateX(-8px);} 40%,60%{transform:translateX(8px);} }
  .shake{ animation: shake 0.4s; }

  /* ---------- END SCREEN ---------- */
  .end-wrap{ text-align:center; padding: 40px 0; }
  .end-wrap h2{ font-size: clamp(30px,6vw,50px); color: var(--gold); margin-bottom: 6px;}
  .rank-list{ display:flex; flex-direction:column; gap:10px; max-width: 420px; margin: 26px auto; }
  .rank-row{ display:flex; justify-content:space-between; align-items:center; background: var(--bg-panel); padding: 14px 18px; border-radius: 12px; border:1px solid rgba(245,183,0,0.15);}
  .rank-row.first{ border-color: var(--gold); box-shadow: 0 0 0 3px rgba(245,183,0,0.15); }
  .rank-name{ font-weight:800; }
  .rank-score{ font-family:'Anton',sans-serif; color: var(--gold); font-size:20px; }

  @media (max-width:520px){
    .scoreboard{ position:static; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){

/* ===================== DATA ===================== */
const QUESTIONS = [
  { text: "What is the absolute best ice cream flavor ever created?", answers: [
    {text:"Vanilla", points:1},{text:"Chocolate", points:2},{text:"Cookies and Cream", points:3},
    {text:"Mint Chocolate Chip", points:4},{text:"Strawberry", points:5},{text:"Salted Caramel", points:6},
    {text:"Cookie Dough", points:7},{text:"Rocky Road", points:8},{text:"Pistachio", points:9},{text:"Butterscotch", points:10}
  ]},
  { text: "What is the scariest animal in the world?", matchMode: "noPartial", answers: [
    {text:"Saltwater Crocodile", points:1, aliases:["Crocodile","Croc","Saltwater Croc","Saltie"]},
    {text:"Great White Shark", points:2, aliases:["Great White","White Shark"]},
    {text:"Hippopotamus", points:3, aliases:["Hippo"]},
    {text:"Box Jellyfish", points:4, aliases:["Jellyfish","Box Jelly"]},
    {text:"King Cobra", points:5, aliases:["Cobra"]},
    {text:"Grizzly Bear", points:6, aliases:["Bear","Grizzly"]},
    {text:"African Lion", points:7, aliases:["Lion"]},
    {text:"Komodo Dragon", points:8, aliases:["Komodo"]},
    {text:"Inland Taipan", points:9, aliases:["Taipan"]},
    {text:"Brazilian Wandering Spider", points:10}
  ]},
  { text: "What male name is the most toxic?", matchMode: "exact", answers: [
    {text:"Kyle", points:1},{text:"Damien", points:2},{text:"Brad", points:3},
    {text:"Chad", points:4},{text:"Blake", points:5},{text:"Bryce", points:6},
    {text:"Jackson", points:7},{text:"Tyler", points:8},{text:"Tom", points:9},{text:"Jake", points:10}
  ]},
  { text: "What is the greatest TV show of all time?", answers: [
    {text:"Friends", points:1},{text:"The Office", points:2},{text:"The Simpsons", points:3},
    {text:"Breaking Bad", points:4},{text:"Big Bang Theory", points:5},{text:"Seinfeld", points:6},
    {text:"Game of Thrones", points:7},{text:"Law & Order", points:8},{text:"Family Guy", points:9},{text:"Fresh Prince of Bel Air", points:10}
  ]},
  { text: "What is the best travel destination (city) in the world?", answers: [
    {text:"Paris", points:1},{text:"New York City", points:2},{text:"Tokyo", points:3},
    {text:"Rome", points:4},{text:"London", points:5},{text:"Madrid", points:6},
    {text:"Bali", points:7},{text:"Amsterdam", points:8},{text:"Sydney", points:9},{text:"Barcelona", points:10}
  ]},
  { text: "What is the best Superpower to have?", answers: [
    {text:"Teleportation", points:1},{text:"Time Travel", points:2},{text:"Invisibility", points:3},
    {text:"Telepathy", points:4},{text:"Flying", points:5, aliases:["Flight","Fly"]},{text:"Super Strength", points:6},
    {text:"Healing", points:7},{text:"Speed", points:8},{text:"Adaptation", points:9},{text:"Shape Shifting", points:10}
  ]},
  { text: "What is the single best invention in human history?", answers: [
    {text:"Internet", points:1},{text:"Electricity", points:2},{text:"Wheel", points:3},
    {text:"Steam Engine", points:4},{text:"Plane", points:5},{text:"Vaccine", points:6},
    {text:"Plumbing", points:7},{text:"Cars", points:8},{text:"Lightbulb", points:9},{text:"Fridge", points:10}
  ]},
  { text: "What is the absolute best book ever written?", answers: [
    {text:"Harry Potter series", points:1},{text:"The Bible", points:2},{text:"To Kill a Mockingbird", points:3},
    {text:"The Great Gatsby", points:4},{text:"1984", points:5},{text:"The Lord of the Rings", points:6},
    {text:"Pride and Prejudice", points:7},{text:"The Catcher in the Rye", points:8},{text:"The Hobbit", points:9},{text:"The Alchemist", points:10}
  ]},
  { text: "What is the most iconic song of all time?", answers: [
    {text:"Bohemian Rhapsody by Queen", points:1},{text:"Thriller by Michael Jackson", points:2},{text:"Smells Like Teen Spirit by Nirvana", points:3},
    {text:"Billie Jean by Michael Jackson", points:4},{text:"Hotel California by Eagles", points:5},{text:"Imagine by John Lennon", points:6},
    {text:"Sweet Child O' Mine by Guns N' Roses", points:7},{text:"Stairway to Heaven by Led Zeppelin", points:8},
    {text:"Hey Jude by The Beatles", points:9},{text:"I Will Always Love You by Whitney Houston", points:10}
  ]},
  { text: "What is the ultimate comfort food?", answers: [
    {text:"Macaroni & Cheese", points:1},{text:"Pizza", points:2},{text:"Chicken Noodle Soup", points:3, aliases:["Soup"]},
    {text:"Ice Cream", points:4},{text:"Grilled Cheese Sandwich", points:5},{text:"Pancakes", points:6},
    {text:"Chocolate", points:7},{text:"French Fries", points:8, aliases:["Chips"]},{text:"Ramen", points:9},{text:"Donuts", points:10, aliases:["Doughnuts","Doughnut"]}
  ]},
  { text: "Who is the greatest male athlete of all time?", matchMode: "exact", answers: [
    {text:"Michael Jordan", points:1, aliases:["Jordan","MJ"]},
    {text:"Pele", points:2, aliases:["Pelé"]},
    {text:"Usain Bolt", points:3, aliases:["Bolt"]},
    {text:"Michael Phelps", points:4, aliases:["Phelps"]},
    {text:"Muhammad Ali", points:5, aliases:["Ali","Mohammed Ali","Cassius Clay"]},
    {text:"Tom Brady", points:6, aliases:["Brady"]},
    {text:"Wayne Gretzky", points:7, aliases:["Gretzky"]},
    {text:"Roger Federer", points:8, aliases:["Federer"]},
    {text:"Babe Ruth", points:9, aliases:["Ruth"]},
    {text:"Don Bradman", points:10, aliases:["Bradman","Donald Bradman"]}
  ]}
];

const PLAYER_COLORS = ["#F5B700","#35C97B","#FF5470","#4FC3F7","#C77DFF"];

/* ===================== FUZZY MATCH ===================== */
function normalize(str){
  return str.toLowerCase()
    .replace(/&/g,'and')
    .replace(/["'’“”.,!?;:()]/g,'')
    .replace(/\b(the|a|an|of)\b/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}
function levenshtein(a,b){
  const m=a.length,n=b.length;
  if(m===0) return n;
  if(n===0) return m;
  const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i;
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      const cost = a[i-1]===b[j-1] ? 0 : 1;
      dp[i][j] = Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+cost);
    }
  }
  return dp[m][n];
}
function candidateStrings(text){
  // Split combined "Song by Artist" style answers so guessing just the
  // song title or just the artist (even with a typo) still counts.
  const parts = text.split(/\s+by\s+/i).map(p=>p.trim()).filter(Boolean);
  return Array.from(new Set([text, ...parts]));
}
function singleMatch(ng, candidateRaw, mode){
  const na = normalize(candidateRaw);
  if(!ng || !na) return false;
  if(ng===na) return true;
  // "exact": only the exact name counts (ignoring case/punctuation)
  if(mode==='exact') return false;
  // Partial matches (e.g. a word contained in the answer) are only allowed in the default mode
  if(mode!=='noPartial' && ng.length>=4 && (na.includes(ng) || ng.includes(na))) return true;
  const dist = levenshtein(ng,na);
  const threshold = Math.max(1, Math.round(na.length*0.22));
  return dist<=threshold;
}
function isMatch(guessRaw, answer, question){
  const ng = normalize(guessRaw);
  if(!ng) return false;
  const mode = question && question.matchMode;
  const candidates = [...candidateStrings(answer.text), ...(answer.aliases||[])];
  return candidates.some(c => singleMatch(ng, c, mode));
}

/* ===================== STATE ===================== */
let state = null;

function freshState(players, totalRounds){
  return {
    players: players.map((name,i)=>({name, score:0, color: PLAYER_COLORS[i]})),
    currentPlayerIndex: 0,
    totalRounds: totalRounds,
    completed: QUESTIONS.map(()=>false),
    revealed: QUESTIONS.map(q=>q.answers.map(()=>false)),
    roundInfo: QUESTIONS.map(()=>({round:1, turnsThisRound:0})),
    roundOverride: QUESTIONS.map(()=>false),
    categoryStarted: QUESTIONS.map(()=>false),
    starterPointer: 0,
    openIndex: null,
  };
}

function advanceTurn(){
  state.currentPlayerIndex = (state.currentPlayerIndex+1) % state.players.length;
}

/* Advances the turn and tracks round progress for a category.
   Returns {newRound: n} if a new round just began, or {roundLimitHit:true}
   if the category has just run out of its allotted rounds (nothing has
   been revealed/closed yet — the caller decides what happens next). */
function advanceAndTrackRound(qi){
  advanceTurn();
  const info = state.roundInfo[qi];
  info.turnsThisRound++;
  if(info.turnsThisRound >= state.players.length){
    info.turnsThisRound = 0;
    info.round++;
    if(info.round > state.totalRounds && !state.roundOverride[qi]){
      return {roundLimitHit:true};
    }
    return {newRound: info.round};
  }
  return {};
}

/* Ends the category with no further points and puts the modal into
   "reveal mode": each hidden answer gets its own "Reveal answer" button,
   and the footer button becomes "Reveal all answers". Nothing is revealed
   until the player chooses. */
function revealRemainingAndComplete(qi, message){
  state.completed[qi] = true;
  const feedback = document.getElementById('feedback');
  const guessBtn = document.getElementById('guessBtn');
  const giveUpBtn = document.getElementById('giveUpBtn');
  const input = document.getElementById('guessInput');
  const closeBtn = document.getElementById('closeBtn');
  if(feedback){ feedback.textContent = message; feedback.className = 'feedback info'; }
  if(guessBtn) guessBtn.disabled = true;
  if(input) input.disabled = true;
  if(closeBtn) closeBtn.textContent = 'Return to board';
  if(giveUpBtn){
    giveUpBtn.disabled = false;
    giveUpBtn.textContent = 'Reveal all answers';
    giveUpBtn.onclick = ()=> revealAnswers(qi);
  }
  renderSlotsOnly(qi);
}

/* Reveals one answer (ai given) or every remaining answer (ai omitted).
   No points are awarded. */
function revealAnswers(qi, ai){
  const q = QUESTIONS[qi];
  if(ai === undefined){
    q.answers.forEach((a,i)=>{ state.revealed[qi][i] = true; });
  } else {
    state.revealed[qi][ai] = true;
  }
  renderSlotsOnly(qi);
  const giveUpBtn = document.getElementById('giveUpBtn');
  const feedback = document.getElementById('feedback');
  if(state.revealed[qi].every(Boolean)){
    if(giveUpBtn) giveUpBtn.disabled = true;
    if(feedback){ feedback.textContent = 'All answers revealed.'; feedback.className = 'feedback info'; }
  }
}

/* ===================== RENDER ===================== */
const app = document.getElementById('app');

function render(){
  if(!state){ renderSetup(); return; }
  if(state.completed.every(Boolean)){ renderEnd(); return; }
  renderGame();
}

/* ---- Setup ---- */
let setupCount = 2;
let setupRounds = 3;
function renderSetup(){
  const names = window.__setupNames || Array.from({length:setupCount},(_,i)=>`Player ${i+1}`);
  window.__setupNames = names;

  app.innerHTML = `
    <div class="setup-wrap">
      <div class="setup-title display">Reverse<br/>Feud</div>
      <div class="setup-sub">Survey says... the crowd is usually wrong. Guess the <b>least popular</b> answer for max points — obvious answers only pay 1.</div>
      <div class="card">
        <div class="step-block">
          <div class="step-label">How many players / teams?</div>
          <div class="count-row" id="countRow"></div>
          <div class="name-list" id="nameList"></div>
        </div>
        <div class="step-block">
          <div class="step-label">Rounds per category</div>
          <div class="count-row" id="roundsRow"></div>
          <div class="rounds-hint">One round = every player gets one guess. A category ends early if all answers are found, or once the round limit is hit.</div>
        </div>
        <div style="margin-top:22px;">
          <button class="btn btn-primary" id="startBtn">Start Game</button>
        </div>
      </div>
    </div>
  `;
  const countRow = document.getElementById('countRow');
  for(let i=1;i<=5;i++){
    const b = document.createElement('button');
    b.className = 'count-btn' + (i===setupCount?' active':'');
    b.textContent = i;
    b.onclick = ()=>{
      setupCount = i;
      const cur = window.__setupNames || [];
      const next = Array.from({length:i},(_,idx)=> cur[idx] || `Player ${idx+1}`);
      window.__setupNames = next;
      renderSetup();
    };
    countRow.appendChild(b);
  }
  const roundsRow = document.getElementById('roundsRow');
  for(let i=1;i<=10;i++){
    const b = document.createElement('button');
    b.className = 'count-btn' + (i===setupRounds?' active':'');
    b.textContent = i;
    b.onclick = ()=>{
      setupRounds = i;
      renderSetup();
    };
    roundsRow.appendChild(b);
  }
  const nameList = document.getElementById('nameList');
  names.forEach((n,idx)=>{
    const row = document.createElement('div');
    row.className='name-row';
    row.innerHTML = `<div class="name-swatch" style="background:${PLAYER_COLORS[idx]}"></div>
      <input type="text" maxlength="18" value="${n.replace(/"/g,'&quot;')}" data-idx="${idx}" placeholder="Player ${idx+1} name">`;
    nameList.appendChild(row);
  });
  nameList.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const i = +e.target.dataset.idx;
      window.__setupNames[i] = e.target.value || `Player ${i+1}`;
    });
  });
  document.getElementById('startBtn').onclick = ()=>{
    const finalNames = window.__setupNames.map((n,i)=> (n && n.trim()) ? n.trim() : `Player ${i+1}`);
    state = freshState(finalNames, setupRounds);
    window.__setupNames = null;
    render();
  };
}

/* ---- Game ---- */
function renderGame(){
  app.innerHTML = `
    <div class="scoreboard" id="scoreboard"></div>
    <div class="title-row">
      <h1 class="display">Reverse Feud</h1>
      <p>Pick a category. The <b style="color:var(--gold)">less popular</b> the guess, the more it's worth.</p>
    </div>
    <div class="board" id="board"></div>
  `;
  const sb = document.getElementById('scoreboard');
  state.players.forEach((p,i)=>{
    const div = document.createElement('div');
    div.className = 'podium' + (i===state.currentPlayerIndex?' active':'');
    div.innerHTML = `<div class="pname" style="color:${p.color}">${escapeHtml(p.name)}</div><div class="pscore">${p.score}</div>`;
    sb.appendChild(div);
  });
  const board = document.getElementById('board');
  QUESTIONS.forEach((q,qi)=>{
    const tile = document.createElement('div');
    tile.className = 'tile' + (state.completed[qi] ? ' done':'');
    tile.innerHTML = `
      <div class="tile-cat">Category</div>
      <div class="tile-number display">${qi+1}</div>
      ${state.completed[qi] ? '<div class="tile-solved">✓ Solved</div>' : ''}
    `;
    if(!state.completed[qi]){
      tile.onclick = ()=>{
        state.openIndex = qi;
        if(!state.categoryStarted[qi]){
          state.currentPlayerIndex = state.starterPointer % state.players.length;
          state.starterPointer++;
          state.categoryStarted[qi] = true;
        }
        renderModal();
      };
    }
    board.appendChild(tile);
  });
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---- Modal ---- */
function renderModal(){
  const qi = state.openIndex;
  const q = QUESTIONS[qi];
  const curPlayer = ()=> state.players[state.currentPlayerIndex];

  const existing = document.getElementById('overlay');
  if(existing) existing.remove();

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-q">${escapeHtml(q.text)}</div>
      <div class="round-label" id="roundLabel">Round ${state.roundInfo[qi].round} of ${state.totalRounds}</div>
      <div class="turn-note">It's <b style="color:${curPlayer().color}">${escapeHtml(curPlayer().name)}</b>'s turn to guess</div>
      <div class="slots" id="slots"></div>
      <div class="guess-row">
        <input type="text" id="guessInput" placeholder="Type your guess..." autocomplete="off">
        <button class="btn btn-guess" id="guessBtn">Guess</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="giveUpBtn">Give up</button>
        <button class="btn btn-close" id="closeBtn">Close board</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener('mousedown', e=>{ if(e.target===overlay) closeModal(); });

  const slotsDiv = document.getElementById('slots');
  q.answers.forEach((a,ai)=>{
    const revealed = state.revealed[qi][ai];
    const row = document.createElement('div');
    row.className = 'slot' + (revealed ? ' revealed':'');
    row.dataset.ai = ai;
    row.innerHTML = `
      <span class="sidx">${ai+1}.</span>
      <span class="sanswer">${revealed ? escapeHtml(a.text) : '???'}</span>
      <span class="spts" data-pts="${a.points} PT${a.points===1?'':'S'}"></span>
    `;
    slotsDiv.appendChild(row);
  });

  const input = document.getElementById('guessInput');
  const feedback = document.getElementById('feedback');

  function submitGuess(){
    const val = input.value.trim();
    if(!val) return;
    // already revealed check
    const alreadyIdx = q.answers.findIndex((a,ai)=> state.revealed[qi][ai] && isMatch(val, a, q));
    if(alreadyIdx !== -1){
      feedback.textContent = "Already found that one — try another!";
      feedback.className = 'feedback info';
      input.value=''; input.focus();
      return;
    }
    const matchIdx = q.answers.findIndex((a,ai)=> !state.revealed[qi][ai] && isMatch(val, a, q));
    if(matchIdx !== -1){
      const ans = q.answers[matchIdx];
      const scorer = curPlayer();
      state.revealed[qi][matchIdx] = true;
      scorer.score += ans.points;
      feedback.textContent = `Correct! "${ans.text}" — +${ans.points} point${ans.points===1?'':'s'} for ${scorer.name}`;
      feedback.className = 'feedback ok';
      input.value='';
      renderSlotsOnly(qi);
      if(state.revealed[qi].every(Boolean)){
        state.completed[qi] = true;
        setTimeout(()=>{ feedback.textContent = 'All answers found! Closing board...'; feedback.className='feedback ok'; setTimeout(closeModal, 1200); }, 400);
        return;
      }
      pauseThenAdvance(qi, input);
    } else {
      feedback.textContent = `Not on the board. ${curPlayer().name}'s turn is over.`;
      feedback.className = 'feedback bad';
      const modalEl = document.querySelector('.modal');
      modalEl.classList.remove('shake'); void modalEl.offsetWidth; modalEl.classList.add('shake');
      input.value='';
      pauseThenAdvance(qi, input);
    }
  }

  // Give the player a moment to actually read the correct/incorrect
  // feedback before the turn changes or a round dialog appears on top of it.
  function pauseThenAdvance(qi, input){
    const guessBtn = document.getElementById('guessBtn');
    const giveUpBtn = document.getElementById('giveUpBtn');
    if(guessBtn) guessBtn.disabled = true;
    if(giveUpBtn) giveUpBtn.disabled = true;
    if(input) input.disabled = true;
    setTimeout(()=>{
      const result = advanceAndTrackRound(qi);
      handleRoundResult(result, input);
    }, 1300);
  }

  function handleRoundResult(result, input){
    if(result.roundLimitHit){
      showRoundLimitDialog(qi,
        ()=>{ // Continue anyway — override the round cap and keep playing
          state.roundOverride[qi] = true;
          reenableControls(input);
          updateTurnNote();
          if(input) input.focus();
        },
        ()=>{ // Reveal all remaining answers, stay on this screen
          revealRemainingAndComplete(qi, 'Round limit reached — reveal the answers one at a time, or all at once. No points awarded.');
        }
      );
      return;
    }
    if(result.newRound){
      showRoundDialog(result.newRound, ()=>{
        reenableControls(input);
        updateTurnNote();
        if(input) input.focus();
      });
    } else {
      reenableControls(input);
      updateTurnNote();
      if(input) input.focus();
    }
  }

  function reenableControls(input){
    const guessBtn = document.getElementById('guessBtn');
    const giveUpBtn = document.getElementById('giveUpBtn');
    if(guessBtn) guessBtn.disabled = false;
    if(giveUpBtn) giveUpBtn.disabled = false;
    if(input) input.disabled = false;
  }

  document.getElementById('guessBtn').onclick = submitGuess;
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') submitGuess(); });
  input.focus();

  document.getElementById('giveUpBtn').onclick = ()=>{
    revealRemainingAndComplete(qi, 'Gave up — reveal the answers one at a time, or all at once. No points awarded.');
  };
  document.getElementById('closeBtn').onclick = closeModal;

  function updateTurnNote(){
    const note = document.querySelector('.turn-note');
    const p = state.players[state.currentPlayerIndex];
    if(note) note.innerHTML = `It's <b style="color:${p.color}">${escapeHtml(p.name)}</b>'s turn to guess`;
    const roundLabel = document.getElementById('roundLabel');
    if(roundLabel) roundLabel.textContent = `Round ${state.roundInfo[qi].round} of ${state.totalRounds}` + (state.roundOverride[qi] ? ' (extended)' : '');
  }
}

/* Shows a blocking "Round limit reached" dialog with two choices:
   continue playing past the cap, or reveal everything and stop. */
function showRoundLimitDialog(qi, onContinueOverride, onRevealAll){
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.style.zIndex = 200;
  overlay.innerHTML = `
    <div class="round-dialog">
      <div class="rd-eyebrow">Round Limit Reached</div>
      <h2 class="rd-title display" style="font-size:28px;">Out of Rounds</h2>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <button class="btn btn-primary" id="overrideBtn">Continue Anyway</button>
        <button class="btn btn-secondary" id="revealAllBtn" style="padding:13px 0;">Reveal Answers</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('overrideBtn').onclick = ()=>{ overlay.remove(); onContinueOverride(); };
  document.getElementById('revealAllBtn').onclick = ()=>{ overlay.remove(); onRevealAll(); };
}

/* Shows a blocking "Round N" dialog on top of the question modal.
   Calls onContinue() once the player dismisses it. */
function showRoundDialog(roundNum, onContinue){
  const dialogOverlay = document.createElement('div');
  dialogOverlay.className = 'overlay';
  dialogOverlay.style.zIndex = 200;
  dialogOverlay.innerHTML = `
    <div class="round-dialog">
      <div class="rd-eyebrow">Round Complete</div>
      <h2 class="rd-title display">Round ${roundNum}</h2>
      <button class="btn btn-primary" id="roundContinueBtn">Continue</button>
    </div>
  `;
  document.body.appendChild(dialogOverlay);
  document.getElementById('roundContinueBtn').onclick = ()=>{
    dialogOverlay.remove();
    onContinue();
  };
}

function renderSlotsOnly(qi){
  const q = QUESTIONS[qi];
  const slotsDiv = document.getElementById('slots');
  if(!slotsDiv) return;
  slotsDiv.querySelectorAll('.slot').forEach(row=>{
    const ai = +row.dataset.ai;
    const revealed = state.revealed[qi][ai];
    const a = q.answers[ai];
    row.className = 'slot' + (revealed?' revealed':'');
    row.querySelector('.sanswer').textContent = revealed ? a.text : '???';
    const old = row.querySelector('.sreveal');
    if(old) old.remove();
    if(state.completed[qi] && !revealed){
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'sreveal';
      btn.textContent = 'Reveal answer';
      btn.onclick = ()=> revealAnswers(qi, ai);
      row.insertBefore(btn, row.querySelector('.spts'));
    }
  });
}

function closeModal(){
  state.openIndex = null;
  const overlay = document.getElementById('overlay');
  if(overlay) overlay.remove();
  render();
}

/* ---- End screen ---- */
function renderEnd(){
  const ranked = [...state.players].sort((a,b)=> b.score - a.score);
  const top = ranked[0].score;
  app.innerHTML = `
    <div class="end-wrap">
      <div class="step-label" style="text-align:center;">Game Over</div>
      <h2 class="display">${ranked.filter(p=>p.score===top).length>1 ? "It's a tie!" : escapeHtml(ranked[0].name)+' wins!'}</h2>
      <div class="rank-list" id="rankList"></div>
      <button class="btn btn-primary" id="playAgainBtn">Play Again</button>
    </div>
  `;
  const rl = document.getElementById('rankList');
  ranked.forEach((p,i)=>{
    const row = document.createElement('div');
    row.className = 'rank-row' + (p.score===top?' first':'');
    row.innerHTML = `<div class="rank-name" style="color:${p.color}">#${i+1} ${escapeHtml(p.name)}</div><div class="rank-score">${p.score} pts</div>`;
    rl.appendChild(row);
  });
  document.getElementById('playAgainBtn').onclick = ()=>{
    state = null;
    setupCount = 2;
    setupRounds = 3;
    window.__setupNames = null;
    render();
  };
}

render();
})();
</script>
</body>
</html>
